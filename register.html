<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EcoConnect</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- ===================================================
       RESPONSIVE BOOTSTRAP NAVBAR
       =================================================== -->
    <nav class="navbar navbar-expand-lg eco-navbar sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" alt="EcoConnect Logo" class="brand-logo">
                <span class="brand-title">EcoConnect</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarRegisterContent" aria-controls="navbarRegisterContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarRegisterContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html#services">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="analytics.html">Analytics</a>
                    </li>
                    <li class="nav-item ms-lg-2 mt-2 mt-lg-0">
                        <a href="login.html" class="btn btn-outline-success text-center d-block d-lg-inline-block">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ===================================================
       PAGE CONTENT (RESPONSIVE 2-COLUMN BOOTSTRAP FORM)
       =================================================== -->
    <main class="form-card-container py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                    
                    <div class="eco-form-card shadow">
                        
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <div class="d-inline-flex p-3 rounded-circle bg-success-subtle text-success mb-2">
                                <i class="bi bi-person-plus fs-3"></i>
                            </div>
                            <h3 class="fw-bold text-success mb-1">Create an Account</h3>
                            <p class="text-muted small">Join EcoConnect to share surplus food and help reduce waste</p>
                        </div>

                        <!-- Success / Error Alert Banner -->
                        <div id="registerSuccessAlert" class="alert alert-success d-none mb-3 text-center small fw-semibold" role="alert"></div>

                        <!-- Register Form -->
                        <form id="registerForm" method="post" action="#">
                            
                            <div class="row g-3 mb-3">
                                
                                <!-- Full Name -->
                                <div class="col-12 col-md-6">
                                    <label for="fullName" class="form-label">Full Name <span class="required">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Enter your full name">
                                    </div>
                                    <span class="error-msg" id="errFullName"></span>
                                </div>

                                <!-- Email Address -->
                                <div class="col-12 col-md-6">
                                    <label for="email" class="form-label">Email Address <span class="required">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email address">
                                    </div>
                                    <span class="error-msg" id="errEmail"></span>
                                </div>

                                <!-- Password -->
                                <div class="col-12 col-md-6">
                                    <label for="password" class="form-label">Password <span class="required">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="password" name="password" placeholder="Create password (e.g. Pass@123)">
                                    </div>
                                    <span class="error-msg" id="errPassword"></span>
                                </div>

                                <!-- Confirm Password -->
                                <div class="col-12 col-md-6">
                                    <label for="confirmPassword" class="form-label">Confirm Password <span class="required">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
                                    </div>
                                    <span class="error-msg" id="errConfirmPassword"></span>
                                </div>

                                <!-- Role Dropdown (Full Width on row) -->
                                <div class="col-12">
                                    <label for="role" class="form-label">Select Role <span class="required">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-briefcase"></i></span>
                                        <select class="form-select" id="role" name="role">
                                            <option value="" disabled selected>-- Select your role --</option>
                                            <option value="restaurant">Restaurant / Donor</option>
                                            <option value="ngo">NGO / Charity Organization</option>
                                            <option value="volunteer">Volunteer</option>
                                            <option value="admin">Platform Administrator</option>
                                        </select>
                                    </div>
                                    <span class="error-msg" id="errRole"></span>
                                </div>

                            </div>

                            <!-- Submit Button -->
                            <button type="submit" id="registerBtn" class="btn btn-eco-primary w-100 py-2 mb-3 shadow-sm">
                                <i class="bi bi-person-check me-1"></i> Register Account
                            </button>

                            <!-- Footer Links -->
                            <div class="text-center small text-muted pt-2 border-top">
                                <p class="mb-1">Already have an account? <a href="login.html" class="text-success fw-semibold text-decoration-none">Login here</a></p>
                                <p class="mb-0"><a href="index.html" class="text-secondary text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Home</a></p>
                            </div>

                        </form>

                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- ===================================================
       FOOTER
       =================================================== -->
    <footer class="eco-footer py-4 mt-auto">
        <div class="container text-center text-md-start">
            <div class="row align-items-center">
                <div class="col-md-6 mb-2 mb-md-0">
                    <span class="fw-bold text-white">EcoConnect</span>
                    <span class="text-white-50 small ms-2">| Food Waste Management System</span>
                </div>
                <div class="col-md-6 text-center text-md-end text-white-50 small">
                    Email: ecoconnect@gmail.com &bull; &copy; 2026 EcoConnect
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
